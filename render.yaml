# Render Blueprint — Diwali Sweets Booking (Mithai)
# Demo: free tier (cold starts OK). Production: switch both services to paid plans
# in the Render dashboard before the booking window opens.
#
# One-time setup after the first deploy:
#   1. Database: the Blueprint creates the free Postgres `jb-db` (same region as the
#      services) and injects host/port/name/user/password into jb-api. Flyway creates
#      the schema on first boot. Remove any manually set DATABASE_URL on jb-api.
#   2. Google Cloud Console → OAuth client → Authorised redirect URI:
#        https://<jb-frontend host>/login/oauth2/code/google
#      (the public site, not the API host).
#   3. Set FRONTEND_ORIGIN on jb-api to https://<jb-frontend host> and
#      API_PROXY_TARGET on jb-frontend to the jb-api URL Render shows.
#   4. Set BOOTSTRAP_ADMIN_EMAILS before the first boot so someone can sign in.

services:
  # Next.js public + staff UI (also proxies /api, /oauth2 and /login/oauth2 to the API)
  - type: web
    name: jb-frontend
    runtime: node
    region: oregon
    plan: free          # production: starter or standard
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Do NOT set NODE_ENV here: with NODE_ENV=production `npm ci` skips devDependencies
      # (typescript, @types/*) and `next build` fails. Next sets production mode itself.
      - key: API_PROXY_TARGET
        # jb-api URL from the Render dashboard, e.g. https://jb-api-xxxx.onrender.com
        sync: false

  # Spring Boot API — Render has no native Java runtime, so this is a Docker service.
  # backend/Dockerfile is multi-stage: Maven builds the jar, then a slim JRE image runs it.
  - type: web
    name: jb-api
    runtime: docker
    region: oregon
    plan: free          # production: starter (min) or standard for the booking window
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database: wired from the Blueprint-managed `jb-db` below. application.yml builds
      # jdbc:postgresql://HOST:PORT/NAME from these (the JDBC driver rejects user:pass@host
      # URLs, so credentials stay in their own variables). To use an external DB such as
      # Neon instead, set DATABASE_URL=jdbc:postgresql://<host>/<db>?sslmode=require plus
      # DATABASE_USERNAME / DATABASE_PASSWORD in the dashboard; DATABASE_URL wins when set.
      - key: DATABASE_HOST
        fromDatabase:
          name: jb-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: jb-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: jb-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: jb-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: jb-db
          property: password
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false        # comma-separated Google emails; applied only to an empty staff table
      - key: FRONTEND_ORIGIN
        sync: false        # https://<jb-frontend host>; drives CORS, cookies, OAuth redirect and receipt links
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: QR_HMAC_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_MODE
        value: test        # production: live
      - key: OTP_PROVIDER
        value: email       # sms once an SMS gateway is wired; the admin toggle decides whether OTP is required
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RECEIPT_CC_EMAILS
        sync: false        # comma-separated committee addresses copied on every receipt

databases:
  # Free tier: expires 30 days after creation. Upgrade (Basic 256MB+) before the booking window.
  - name: jb-db
    region: oregon
    plan: free
    postgresMajorVersion: "16"
    databaseName: jb_mithai
    user: jb
    ipAllowList: []     # private-network access only (jb-api); add your IP here for psql access
