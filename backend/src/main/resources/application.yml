spring:
  application:
    name: jb-api
  profiles:
    # Fail closed: without an explicit profile the app runs as production (no demo routes,
    # real secrets required). Local development sets SPRING_PROFILES_ACTIVE=local.
    active: ${SPRING_PROFILES_ACTIVE:prod}
  # Load the repo-root .env (and backend/.env if present) as config data.
  # OS environment variables still win over these values.
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
      - "optional:file:../../.env[.properties]"
  datasource:
    # Either a full DATABASE_URL (Neon/local) or the parts Render injects from the Blueprint DB.
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:mithai}}
    username: ${DATABASE_USERNAME:jb}
    password: ${DATABASE_PASSWORD:jb}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # Databases created before Flyway (local Docker) are adopted as version 1; a fresh
    # Neon database gets V1__schema.sql applied on first boot.
    baseline-on-migrate: true
    baseline-version: 1
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder}
            scope: openid,email,profile
            # Google must redirect to the public site (the Next proxy forwards it here) so the
            # session cookie is set on the origin the browser actually uses.
            redirect-uri: ${FRONTEND_ORIGIN:http://localhost:3000}/login/oauth2/code/{registrationId}

server:
  port: ${PORT:8080}
  # Behind Render's TLS proxy and the Next rewrite: honour X-Forwarded-* for scheme and host.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info

jb:
  qr-hmac-secret: ${QR_HMAC_SECRET:dev-only-change-me-32bytes-min!!}
  qr-key-id: ${QR_KEY_ID:k1}
  jwt-secret: ${JWT_SECRET:dev-jwt-secret-change-me-32bytes-minimum!}
  jwt-ttl-minutes: 480
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  otp-provider: ${OTP_PROVIDER:email}   # email | sms | dev
  otp-ttl-minutes: 5
  email-provider: ${EMAIL_PROVIDER:console}  # console | resend
  email-from: ${EMAIL_FROM:bookings@example.com}
  resend-api-key: ${RESEND_API_KEY:}
  receipt-cc-emails: ${RECEIPT_CC_EMAILS:}
  razorpay-mode: ${RAZORPAY_MODE:test}
  razorpay-key-id: ${RAZORPAY_KEY_ID:}
  razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
  razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  # Online orders one mobile / one client IP may start per hour (spam protection).
  order-limit-per-mobile-per-hour: ${ORDER_LIMIT_PER_MOBILE_PER_HOUR:5}
  order-limit-per-ip-per-hour: ${ORDER_LIMIT_PER_IP_PER_HOUR:30}
  booking-enabled-override: ${BOOKING_ENABLED_OVERRIDE:}   # empty = use DB setting
  bootstrap-admin-emails: ${BOOTSTRAP_ADMIN_EMAILS:}      # comma-separated; used only when the staff table is empty

logging:
  level:
    com.jb: INFO
