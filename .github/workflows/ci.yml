name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests (surefire) then *IT integration tests (failsafe) against Postgres in Docker.
      - run: mvn -B verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build

  e2e:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jb_e2e
          POSTGRES_USER: jb
          POSTGRES_PASSWORD: jb
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U jb -d jb_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAZORPAY_TEST_KEY_ID: ${{ secrets.RAZORPAY_TEST_KEY_ID }}
      RAZORPAY_TEST_KEY_SECRET: ${{ secrets.RAZORPAY_TEST_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Build API jar
        run: mvn -B -q -DskipTests package
        working-directory: backend
      - name: Build frontend
        run: npm ci && npm run build
        working-directory: frontend
      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Note when the real-payment test will be skipped
        if: env.RAZORPAY_TEST_KEY_ID == ''
        run: echo "::warning title=Razorpay test skipped::Add RAZORPAY_TEST_KEY_ID and RAZORPAY_TEST_KEY_SECRET repository secrets (rzp_test_ keys) to run the real-payment UI test."
      - name: Run UI tests
        run: npx playwright test
        working-directory: e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
